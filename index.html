<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudSync Pro - Enhanced Cloud Storage</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // Icons (same as before)
        const Upload = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"/></svg>;
        const Cloud = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/></svg>;
        const Server = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"/></svg>;
        const Settings = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>;
        const File = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>;
        const Download = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>;
        const Eye = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>;
        const Trash2 = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>;
        const LogOut = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>;
        const CheckCircle = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
        const X = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"/></svg>;
        const Mail = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 8l7.89 6.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>;
        const TrendingUp = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>;
        const Activity = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/></svg>;
        const Power = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 9l4-4 4 4m0 6l-4 4-4-4"/></svg>;
        const Star = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>;
        const Zap = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>;
        const Database = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 7v10c0 2.21 3.582 4 8 4s8-1.79 8-4V7M4 7c0 2.21 3.582 4 8 4s8-1.79 8-4M4 7c0-2.21 3.582-4 8-4s8 1.79 8 4m0 5c0 2.21-3.582 4-8 4s-8-1.79-8-4"/></svg>;
        const AlertCircle = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>;
        const HardDrive = ({ className }) => <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>;

const CloudStoragePlatform = () => {
  const [currentView, setCurrentView] = useState('login');
  const [isAuthenticated, setIsAuthenticated] = useState(false);
  const [userRole, setUserRole] = useState('user');
  const [currentUser, setCurrentUser] = useState(null);
  
  // Auth states
  const [authForm, setAuthForm] = useState({ username: '', email: '', password: '', phone: '' });
  const [otpForm, setOtpForm] = useState({ email: '', otp: '' });
  const [showOtpModal, setShowOtpModal] = useState(false);
  const [loginEmail, setLoginEmail] = useState('');
  
  // Storage configurations
  const ADMIN_EMAIL = 'admin@cloudsync.com';
  const ADMIN_PASSWORD = 'AdminSecure123!';
  const USER_STORAGE = 30 * 1024 * 1024 * 1024; // 30GB for regular users
  const VIP_STORAGE = 100 * 1024 * 1024 * 1024; // 100GB for VIP users
  const NODE_STORAGE = 10 * 1024 * 1024 * 1024; // 10GB per node
  
  const [userStorage, setUserStorage] = useState({ 
    used: 0, 
    total: USER_STORAGE 
  });
  const [files, setFiles] = useState([]);
  const [uploadProgress, setUploadProgress] = useState(null);
  const [selectedFile, setSelectedFile] = useState(null);
  const [showFileViewer, setShowFileViewer] = useState(false);
  
  // 6 nodes
  const [nodes, setNodes] = useState([
    { id: 1, name: 'Node Alpha', ip: '10.0.1.1', mac: '02:1a:2b:3c:4d:5e', status: 'online', storage: { used: 0, total: NODE_STORAGE }, files: [], bandwidth: { current: 12.5, max: 100 }, uptime: '24h 15m', cpu: 45, memory: 62, temp: 42 },
    { id: 2, name: 'Node Beta', ip: '10.0.1.2', mac: '02:2a:3b:4c:5d:6e', status: 'online', storage: { used: 0, total: NODE_STORAGE }, files: [], bandwidth: { current: 8.3, max: 100 }, uptime: '24h 12m', cpu: 38, memory: 55, temp: 38 },
    { id: 3, name: 'Node Gamma', ip: '10.0.1.3', mac: '02:3a:4b:5c:6d:7e', status: 'online', storage: { used: 0, total: NODE_STORAGE }, files: [], bandwidth: { current: 15.7, max: 100 }, uptime: '24h 08m', cpu: 52, memory: 68, temp: 45 },
    { id: 4, name: 'Node Delta', ip: '10.0.1.4', mac: '02:4a:5b:6c:7d:8e', status: 'online', storage: { used: 0, total: NODE_STORAGE }, files: [], bandwidth: { current: 9.2, max: 100 }, uptime: '23h 45m', cpu: 41, memory: 58, temp: 40 },
    { id: 5, name: 'Node Epsilon', ip: '10.0.1.5', mac: '02:5a:6b:7c:8d:9e', status: 'online', storage: { used: 0, total: NODE_STORAGE }, files: [], bandwidth: { current: 11.8, max: 100 }, uptime: '23h 30m', cpu: 48, memory: 64, temp: 43 },
    { id: 6, name: 'Node Zeta', ip: '10.0.1.6', mac: '02:6a:7b:8c:9d:0e', status: 'online', storage: { used: 0, total: NODE_STORAGE }, files: [], bandwidth: { current: 7.5, max: 100 }, uptime: '23h 20m', cpu: 35, memory: 51, temp: 36 }
  ]);

  // Real-time updates for admin (simulate)
  useEffect(() => {
    if (userRole === 'admin') {
      const interval = setInterval(() => {
        setNodes(prevNodes => prevNodes.map(node => ({
          ...node,
          bandwidth: { ...node.bandwidth, current: Math.max(0, Math.min(node.bandwidth.max, node.bandwidth.current + (Math.random() - 0.5) * 5)) },
          cpu: Math.max(0, Math.min(100, node.cpu + (Math.random() - 0.5) * 10)),
          memory: Math.max(0, Math.min(100, node.memory + (Math.random() - 0.5) * 8)),
          temp: Math.max(30, Math.min(80, node.temp + (Math.random() - 0.5) * 3))
        })));
      }, 3000);
      return () => clearInterval(interval);
    }
  }, [userRole]);

  const formatBytes = (bytes) => {
    if (bytes === 0) return '0 Bytes';
    const k = 1024;
    const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
  };

  // Signup
  const handleSignup = async () => {
    if (!authForm.username || !authForm.email || !authForm.password) {
      alert('❌ Please fill all required fields');
      return;
    }
    
    try {
      const response = await fetch('http://localhost:5000/api/auth/signup', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(authForm)
      });
      
      const data = await response.json();
      
      if (data.success) {
        alert('🎉 Account created! Check your email for welcome message. You can now login.');
        setCurrentView('login');
        setAuthForm({ username: '', email: '', password: '', phone: '' });
      } else {
        alert('❌ ' + (data.error || 'Signup failed'));
      }
    } catch (error) {
      console.error('Signup error:', error);
      alert('❌ Connection failed. Please check if the server is running.');
    }
  };

  // Login
  const handleLogin = async () => {
    if (!authForm.email || !authForm.password) {
      alert('❌ Please enter email and password');
      return;
    }
    
    // Check for admin
    if (authForm.email === ADMIN_EMAIL && authForm.password === ADMIN_PASSWORD) {
      const adminUser = {
        username: 'Administrator',
        email: ADMIN_EMAIL,
        role: 'admin',
        uid: 'admin_001'
      };
      
      setCurrentUser(adminUser);
      setUserRole('admin');
      setIsAuthenticated(true);
      setCurrentView('admin-dashboard');
      alert('✅ Admin login successful!');
      return;
    }
    
    // For regular users, send OTP
    try {
      const response = await fetch('http://localhost:5000/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: authForm.email,
          password: authForm.password
        })
      });
      
      const data = await response.json();
      
      if (data.success && data.requires_otp) {
        setLoginEmail(data.email || authForm.email);
        setOtpForm({ email: data.email || authForm.email, otp: '' });
        setShowOtpModal(true);
        alert('📧 OTP sent to your email! Please check your inbox.');
      } else {
        alert('❌ ' + (data.error || 'Login failed'));
      }
    } catch (error) {
      console.error('Login error:', error);
      alert('❌ Connection failed. Please check if the server is running.');
    }
  };

  const handleVerifyOtp = async () => {
    if (otpForm.otp.length !== 6) {
      alert('❌ Please enter a valid 6-digit OTP');
      return;
    }
    
    try {
      const response = await fetch('http://localhost:5000/api/auth/verify-otp', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(otpForm)
      });
      
      const data = await response.json();
      
      if (data.success && data.user) {
        setCurrentUser(data.user);
        setUserRole(data.user.role);
        
        // Set storage based on role
        const storage = data.user.role === 'vip' ? VIP_STORAGE : USER_STORAGE;
        setUserStorage({ used: 0, total: storage });
        
        setIsAuthenticated(true);
        setShowOtpModal(false);
        setCurrentView('dashboard');
        
        const roleMessage = data.user.role === 'vip' ? '⭐ VIP Account' : 'Standard Account';
        alert(`✅ Login successful! ${roleMessage}`);
      } else {
        alert('❌ ' + (data.error || 'Invalid OTP'));
      }
    } catch (error) {
      console.error('OTP verification error:', error);
      alert('❌ Verification failed. Please try again.');
    }
  };

  // File upload
  const handleFileUpload = async (event) => {
    const file = event.target.files[0];
    if (!file) return;

    const fileSize = file.size;
    const availableSpace = userStorage.total - userStorage.used;

    if (fileSize > availableSpace) {
      alert('❌ Insufficient storage space!');
      return;
    }

    const onlineNodes = nodes.filter(n => n.status === 'online');
    if (onlineNodes.length < 6) {
      alert(`⚠️ Only ${onlineNodes.length}/6 nodes online.`);
    }

    const newFile = {
      id: Date.now(),
      name: file.name,
      size: fileSize,
      uploadedAt: new Date().toISOString(),
      replicas: [],
      type: file.type || 'application/octet-stream',
      content: URL.createObjectURL(file)
    };

    setUploadProgress({ 
      fileName: file.name, 
      progress: 0, 
      currentNode: null,
      totalNodes: onlineNodes.length,
      completedNodes: 0
    });

    for (let i = 0; i < onlineNodes.length; i++) {
      const node = onlineNodes[i];
      
      setUploadProgress(prev => ({ 
        ...prev, 
        currentNode: node.name,
        progress: ((i + 0.5) / onlineNodes.length) * 100,
        completedNodes: i
      }));
      
      const uploadTime = Math.min(2000, (fileSize / (1024 * 1024)) * 500);
      await new Promise(resolve => setTimeout(resolve, uploadTime));
      
      setNodes(prevNodes => prevNodes.map(n => 
        n.id === node.id 
          ? { 
              ...n, 
              storage: { ...n.storage, used: n.storage.used + fileSize },
              files: [...n.files, newFile.id]
            }
          : n
      ));
      
      newFile.replicas.push({ 
        nodeId: node.id, 
        nodeName: node.name,
        nodeIp: node.ip 
      });
      
      setUploadProgress(prev => ({ 
        ...prev, 
        progress: ((i + 1) / onlineNodes.length) * 100,
        completedNodes: i + 1
      }));
    }

    setUserStorage(prev => ({ ...prev, used: prev.used + fileSize }));
    setFiles(prev => [...prev, newFile]);

    setTimeout(() => setUploadProgress(null), 2000);
    alert(`✅ File uploaded and replicated to ${onlineNodes.length} nodes!`);
  };

  const handleDeleteFile = (fileId) => {
    const file = files.find(f => f.id === fileId);
    if (!file) return;

    if (confirm(`🗑️ Delete "${file.name}"?`)) {
      file.replicas.forEach(replica => {
        setNodes(prevNodes => prevNodes.map(node => 
          node.id === replica.nodeId
            ? {
                ...node,
                storage: { ...node.storage, used: Math.max(0, node.storage.used - file.size) },
                files: node.files.filter(fid => fid !== fileId)
              }
            : node
        ));
      });

      setUserStorage(prev => ({ ...prev, used: Math.max(0, prev.used - file.size) }));
      setFiles(prev => prev.filter(f => f.id !== fileId));
      alert(`✅ File deleted`);
    }
  };

  const handleDownloadFile = (file) => {
    const link = document.createElement('a');
    link.href = file.content;
    link.download = file.name;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  };

  const handleToggleNodeStatus = (nodeId) => {
    setNodes(prevNodes => prevNodes.map(node => 
      node.id === nodeId 
        ? { ...node, status: node.status === 'online' ? 'offline' : 'online' }
        : node
    ));
  };

  // OTP Modal
  const OtpModal = () => (
    <div className="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 z-50">
      <div className="bg-white rounded-2xl p-8 w-full max-w-md shadow-2xl">
        <div className="text-center mb-6">
          <div className="inline-flex items-center justify-center w-16 h-16 bg-blue-100 rounded-full mb-4">
            <Mail className="w-8 h-8 text-blue-500" />
          </div>
          <h2 className="text-2xl font-bold mb-2">Verify OTP</h2>
          <p className="text-gray-600">Enter the 6-digit code sent to</p>
          <p className="font-semibold text-gray-900">{loginEmail}</p>
          <p className="text-sm text-blue-600 mt-2">
            📧 Check your email inbox
          </p>
        </div>
        <input
          type="text"
          maxLength="6"
          placeholder="000000"
          value={otpForm.otp}
          onChange={(e) => setOtpForm({ ...otpForm, otp: e.target.value.replace(/\D/g, '') })}
          className="w-full px-4 py-3 border-2 border-gray-300 rounded-xl text-center text-2xl tracking-widest mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
          autoFocus
        />
        <div className="flex gap-3">
          <button
            onClick={() => {
              setShowOtpModal(false);
              setOtpForm({ email: '', otp: '' });
            }}
            className="flex-1 py-3 bg-gray-200 hover:bg-gray-300 rounded-xl font-semibold"
          >
            Cancel
          </button>
          <button
            onClick={handleVerifyOtp}
            className="flex-1 py-3 bg-blue-500 hover:bg-blue-600 text-white rounded-xl font-semibold"
          >
            Verify
          </button>
        </div>
      </div>
    </div>
  );

  // Login/Signup UI
  if (!isAuthenticated) {
    return (
      <>
        <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 flex items-center justify-center p-4">
          <div className="bg-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-8 w-full max-w-md border border-white/20">
            <div className="text-center mb-8">
              <div className="inline-flex items-center justify-center w-20 h-20 bg-gradient-to-br from-blue-500 via-purple-500 to-pink-500 rounded-2xl mb-4 shadow-2xl">
                <Cloud className="w-10 h-10 text-white" />
              </div>
              <h1 className="text-4xl font-bold text-white mb-2">CloudSync Pro</h1>
              <p className="text-blue-200 text-lg">Enterprise Cloud Storage</p>
            </div>

            <div className="flex mb-6 bg-white/5 rounded-xl p-1">
              <button
                onClick={() => setCurrentView('login')}
                className={`flex-1 py-3 rounded-lg transition-all font-medium ${currentView === 'login' ? 'bg-gradient-to-r from-blue-500 to-purple-500 text-white shadow-lg' : 'text-white/70'}`}
              >
                Login
              </button>
              <button
                onClick={() => setCurrentView('signup')}
                className={`flex-1 py-3 rounded-lg transition-all font-medium ${currentView === 'signup' ? 'bg-gradient-to-r from-blue-500 to-purple-500 text-white shadow-lg' : 'text-white/70'}`}
              >
                Sign Up
              </button>
            </div>

            {currentView === 'signup' && (
              <div className="space-y-4">
                <input
                  type="text"
                  placeholder="Username"
                  value={authForm.username}
                  onChange={(e) => setAuthForm({ ...authForm, username: e.target.value })}
                  className="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <input
                  type="email"
                  placeholder="Email"
                  value={authForm.email}
                  onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                  className="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <input
                  type="password"
                  placeholder="Password"
                  value={authForm.password}
                  onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                  className="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <input
                  type="tel"
                  placeholder="Phone (Optional)"

                  onChange={(e) => setAuthForm({ ...authForm, phone: e.target.value })}

                  Create Account
                </button>
              </div>

              <div className="space-y-4">
                <input
                  type="email"
                  placeholder="Email"
                  value={authForm.email}
                  onChange={(e) => setAuthForm({ ...authForm, email: e.target.value })}
                  className="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <input
                  type="password"
                  placeholder="Password"
                  value={authForm.password}
                  onChange={(e) => setAuthForm({ ...authForm, password: e.target.value })}
                  className="w-full px-4 py-3 bg-white/10 border border-white/20 rounded-xl text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-blue-500"
                />
                <div className="text-sm text-white/70 bg-white/5 rounded-lg p-3">
                  <p className="font-semibold mb-1">Admin Access:</p>
                  <p>Email: admin@cloudsync.com</p>
                  <p>Password: AdminSecure123!</p>
                </div>
                <button
                  onClick={handleLogin}
                  className="w-full py-3 bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 text-white rounded-xl font-bold text-lg transition-all shadow-lg"
                >
                  Login
                </button>
              </div>
            )}
          </div>
        </div>
        {showOtpModal && <OtpModal />}
      </>
    );
  }

  // Admin Dashboard
  if (userRole === 'admin') {
    const onlineNodes = nodes.filter(n => n.status === 'online');
    const totalStorageUsed = nodes.reduce((sum, n) => sum + n.storage.used, 0);
    const totalStorageCapacity = nodes.reduce((sum, n) => sum + n.storage.total, 0);
    const avgCPU = nodes.reduce((sum, n) => sum + n.cpu, 0) / nodes.length;
    const avgMemory = nodes.reduce((sum, n) => sum + n.memory, 0) / nodes.length;
    
    return (
      <div className="min-h-screen bg-gradient-to-br from-gray-900 via-slate-800 to-gray-900">
        {/* Admin Header */}
        <header className="bg-gradient-to-r from-purple-900 via-indigo-900 to-purple-900 border-b border-purple-700 shadow-2xl">
          <div className="max-w-7xl mx-auto px-6 py-6">
            <div className="flex items-center justify-between">
              <div className="flex items-center gap-4">
                <div className="w-14 h-14 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-2xl flex items-center justify-center shadow-xl">
                  <Settings className="w-7 h-7 text-white" />
                </div>
                <div>
                  <h1 className="text-2xl font-bold text-white">Admin Control Center</h1>
                  <p className="text-purple-200">Real-time Node Monitoring & Management</p>
                </div>
              </div>
              <button
                onClick={() => {
                  if (confirm('Logout from admin panel?')) {
                    setIsAuthenticated(false);
                    setCurrentView('login');
                  }
                }}
                className="flex items-center gap-2 px-6 py-3 bg-red-500 hover:bg-red-600 text-white rounded-xl font-semibold shadow-lg transition-all"
              >
                <LogOut className="w-5 h-5" />
                Logout
              </button>
            </div>
          </div>
        </header>

        <div className="max-w-7xl mx-auto px-6 py-8">
          {/* System Overview Stats */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
            <div className="bg-gradient-to-br from-blue-600 to-blue-700 rounded-2xl p-6 shadow-xl">
              <div className="flex items-center justify-between mb-3">
                <span className="text-blue-100 text-sm font-medium">Active Nodes</span>
                <Server className="w-6 h-6 text-blue-200" />
              </div>
              <p className="text-4xl font-bold text-white">{onlineNodes.length}</p>
              <p className="text-sm text-blue-200 mt-1">of {nodes.length} total</p>
            </div>
            
            <div className="bg-gradient-to-br from-green-600 to-green-700 rounded-2xl p-6 shadow-xl">
              <div className="flex items-center justify-between mb-3">
                <span className="text-green-100 text-sm font-medium">Storage Used</span>
                <Database className="w-6 h-6 text-green-200" />
              </div>
              <p className="text-4xl font-bold text-white">{formatBytes(totalStorageUsed)}</p>
              <p className="text-sm text-green-200 mt-1">of {formatBytes(totalStorageCapacity)}</p>
            </div>
            
            <div className="bg-gradient-to-br from-purple-600 to-purple-700 rounded-2xl p-6 shadow-xl">
              <div className="flex items-center justify-between mb-3">
                <span className="text-purple-100 text-sm font-medium">Avg CPU Usage</span>
                <Activity className="w-6 h-6 text-purple-200" />
              </div>
              <p className="text-4xl font-bold text-white">{avgCPU.toFixed(1)}%</p>
              <p className="text-sm text-purple-200 mt-1">Across all nodes</p>
            </div>
            
            <div className="bg-gradient-to-br from-orange-600 to-orange-700 rounded-2xl p-6 shadow-xl">
              <div className="flex items-center justify-between mb-3">
                <span className="text-orange-100 text-sm font-medium">Avg Memory</span>
                <HardDrive className="w-6 h-6 text-orange-200" />
              </div>
              <p className="text-4xl font-bold text-white">{avgMemory.toFixed(1)}%</p>
              <p className="text-sm text-orange-200 mt-1">RAM utilization</p>
            </div>
          </div>

          {/* Real-time Node Monitoring */}
          <div className="bg-gray-800/50 backdrop-blur-sm rounded-2xl shadow-2xl border border-gray-700">
            <div className="p-6 border-b border-gray-700">
              <div className="flex items-center justify-between">
                <div>
                  <h2 className="text-2xl font-bold text-white">Live Node Monitoring</h2>
                  <p className="text-gray-400 mt-1">Real-time metrics updated every 3 seconds</p>
                </div>
                <div className="flex items-center gap-2 text-green-400">
                  <div className="w-3 h-3 bg-green-400 rounded-full animate-pulse"></div>
                  <span className="text-sm font-medium">Live</span>
                </div>
              </div>
            </div>
            
            <div className="p-6 space-y-6">
              {nodes.map(node => (
                <div key={node.id} className="bg-gray-900/50 border-2 border-gray-700 rounded-xl p-6 hover:border-purple-500 transition-all">
                  <div className="flex items-start justify-between mb-6">
                    <div className="flex items-center gap-4">
                      <div className={`w-4 h-4 rounded-full ${node.status === 'online' ? 'bg-green-500 animate-pulse' : 'bg-red-500'}`}></div>
                      <div>
                        <h3 className="text-xl font-bold text-white">{node.name}</h3>
                        <p className="text-gray-400 text-sm">IP: {node.ip} • MAC: {node.mac}</p>
                      </div>
                    </div>
                    <div className="flex items-center gap-3">
                      <span className={`px-4 py-2 rounded-lg text-sm font-semibold ${node.status === 'online' ? 'bg-green-500/20 text-green-400' : 'bg-red-500/20 text-red-400'}`}>
                        {node.status.toUpperCase()}
                      </span>
                      <button
                        onClick={() => handleToggleNodeStatus(node.id)}
                        className="p-2 bg-gray-700 hover:bg-gray-600 rounded-lg transition-all"
                        title="Toggle Status"
                      >
                        <Power className="w-5 h-5 text-white" />
                      </button>
                    </div>
                  </div>

                  {/* Real-time Metrics */}
                  <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                    <div className="bg-gray-800/50 rounded-lg p-4">
                      <p className="text-xs text-gray-400 mb-1">CPU Usage</p>
                      <p className="text-2xl font-bold text-blue-400">{node.cpu.toFixed(1)}%</p>
                      <div className="mt-2 bg-gray-700 rounded-full h-2">
                        <div className="bg-blue-500 h-2 rounded-full transition-all" style={{ width: `${node.cpu}%` }}></div>
                      </div>
                    </div>
                    
                    <div className="bg-gray-800/50 rounded-lg p-4">
                      <p className="text-xs text-gray-400 mb-1">Memory</p>
                      <p className="text-2xl font-bold text-green-400">{node.memory.toFixed(1)}%</p>
                      <div className="mt-2 bg-gray-700 rounded-full h-2">
                        <div className="bg-green-500 h-2 rounded-full transition-all" style={{ width: `${node.memory}%` }}></div>
                      </div>
                    </div>
                    
                    <div className="bg-gray-800/50 rounded-lg p-4">
                      <p className="text-xs text-gray-400 mb-1">Bandwidth</p>
                      <p className="text-2xl font-bold text-purple-400">{node.bandwidth.current.toFixed(1)}</p>
                      <p className="text-xs text-gray-500">/ {node.bandwidth.max} Mbps</p>
                    </div>
                    
                    <div className="bg-gray-800/50 rounded-lg p-4">
                      <p className="text-xs text-gray-400 mb-1">Temperature</p>
                      <p className="text-2xl font-bold text-orange-400">{node.temp.toFixed(0)}°C</p>
                      <p className="text-xs text-gray-500">Normal range</p>
                    </div>
                  </div>

                  {/* Storage Info */}
                  <div className="bg-gray-800/50 rounded-lg p-4">
                    <div className="flex justify-between items-center mb-2">
                      <span className="text-sm text-gray-400">Storage Capacity</span>
                      <span className="text-sm font-semibold text-white">
                        {formatBytes(node.storage.used)} / {formatBytes(node.storage.total)}

                    </div>
                    <div className="bg-gray-700 rounded-full h-3">
                      <div

                        style={{ width: `${(node.storage.used / node.storage.total) * 100}%` }}
                      ></div>
                    </div>
                    <div className="flex justify-between mt-2">
                      <span className="text-xs text-gray-500">{((node.storage.used / node.storage.total) * 100).toFixed(1)}% used</span>
                      <span className="text-xs text-gray-500">{node.files.length} files • Uptime: {node.uptime}</span>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>
    );
  }

  const NavigationTabs = () => (
    <div className="flex gap-2 mb-8">
      <button
        onClick={() => setCurrentView('dashboard')}
        className={`flex items-center gap-2 px-4 py-2 rounded-xl transition-all ${currentView === 'dashboard' ? 'bg-gradient-to-r from-blue-500 to-purple-500 text-white shadow-lg' : 'bg-white hover:bg-gray-100 text-gray-700'}`}
      >
        <TrendingUp className="w-4 h-4" />
        Dashboard
      </button>
      <button
        onClick={() => setCurrentView('files')}
        className={`flex items-center gap-2 px-4 py-2 rounded-xl transition-all ${currentView === 'files' ? 'bg-gradient-to-r from-blue-500 to-purple-500 text-white shadow-lg' : 'bg-white hover:bg-gray-100 text-gray-700'}`}
      >
        <File className="w-4 h-4" />
        My Files ({files.length})
      </button>
    </div>
  );

  const DashboardView = () => {
    const totalUsed = files.reduce((sum, f) => sum + f.size, 0);
    const usedPercentage = (totalUsed / userStorage.total) * 100;
    
    return (
      <div className="space-y-8">
        {/* VIP Badge */}
        {userRole === 'vip' && (
          <div className="bg-gradient-to-r from-yellow-400 via-yellow-500 to-yellow-600 rounded-2xl p-6 shadow-xl">
            <div className="flex items-center gap-4">
              <div className="w-16 h-16 bg-white/20 rounded-xl flex items-center justify-center">
                <Star className="w-8 h-8 text-white" />
              </div>
              <div>
                <h3 className="text-2xl font-bold text-white">VIP Account</h3>
                <p className="text-yellow-100">Enjoying 100GB premium storage with priority support</p>
              </div>
            </div>
          </div>
        )}

        {/* Stats Cards */}
        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div className="bg-gradient-to-br from-blue-500 to-blue-600 text-white rounded-2xl shadow-xl p-6">
            <div className="flex items-center justify-between mb-3">
              <span className="text-blue-100 text-sm">Storage Used</span>
              <HardDrive className="w-5 h-5 text-blue-200" />
            </div>
            <p className="text-3xl font-bold">{formatBytes(totalUsed)}</p>
            <p className="text-sm text-blue-200 mt-1">of {formatBytes(userStorage.total)}</p>
            <div className="mt-4 bg-blue-400/50 rounded-full h-2">
              <div 
                className="bg-white rounded-full h-2 transition-all duration-500"
                style={{ width: `${Math.min(usedPercentage, 100)}%` }}
              />
            </div>
          </div>
          
          <div className="bg-gradient-to-br from-green-500 to-green-600 text-white rounded-2xl shadow-xl p-6">
            <div className="flex items-center justify-between mb-3">
              <span className="text-green-100 text-sm">Total Files</span>
              <File className="w-5 h-5 text-green-200" />
            </div>
            <p className="text-3xl font-bold">{files.length}</p>
            <p className="text-sm text-green-200 mt-1">Securely stored</p>
          </div>
          
          <div className="bg-gradient-to-br from-purple-500 to-purple-600 text-white rounded-2xl shadow-xl p-6">
            <div className="flex items-center justify-between mb-3">
              <span className="text-purple-100 text-sm">Account Type</span>
              {userRole === 'vip' ? <Star className="w-5 h-5 text-yellow-300" /> : <Zap className="w-5 h-5 text-purple-200" />}
            </div>
            <p className="text-3xl font-bold">{userRole === 'vip' ? 'VIP' : 'Standard'}</p>
            <p className="text-sm text-purple-200 mt-1">{userRole === 'vip' ? '100GB Storage' : '30GB Storage'}</p>
          </div>
        </div>

        {/* Quick Upload */}
        <div className="bg-gradient-to-br from-indigo-50 to-purple-50 border-2 border-dashed border-indigo-300 rounded-2xl p-8 text-center">
          <Upload className="w-16 h-16 text-indigo-500 mx-auto mb-4" />
          <h3 className="text-2xl font-bold text-gray-900 mb-2">Upload Files</h3>
          <p className="text-gray-600 mb-6">Secure cloud storage with automatic replication</p>
          <label className="inline-flex items-center gap-2 px-8 py-3 bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white rounded-xl cursor-pointer transition-all shadow-lg text-lg font-semibold">
            <Upload className="w-5 h-5" />
            Choose Files
            <input
              type="file"
              onChange={handleFileUpload}
              className="hidden"
            />
          </label>
        </div>

        {/* Upload Progress */}
        {uploadProgress && (
          <div className="bg-white border-2 border-blue-500 rounded-2xl p-6 shadow-xl">
            <div className="flex items-center gap-3 mb-4">
              <Upload className="w-8 h-8 text-blue-500 animate-pulse" />
              <div className="flex-1">
                <h4 className="font-bold text-gray-900 text-lg">{uploadProgress.fileName}</h4>
                <p className="text-sm text-gray-600">
                  Uploading... ({uploadProgress.completedNodes}/{uploadProgress.totalNodes} complete)
                </p>
              </div>
            </div>
            <div className="w-full bg-gray-200 rounded-full h-4">
              <div
                className="bg-gradient-to-r from-blue-500 to-purple-500 h-4 rounded-full transition-all flex items-center justify-center"
                style={{ width: `${uploadProgress.progress}%` }}
              >
                <span className="text-xs text-white font-bold">{uploadProgress.progress.toFixed(0)}%</span>
              </div>
            </div>
          </div>
        )}

        {/* Recent Files */}
        <div className="bg-white rounded-2xl shadow-lg border border-gray-200">
          <div className="p-6 border-b border-gray-200">
            <h3 className="text-xl font-bold">Recent Files</h3>
          </div>
          <div className="divide-y divide-gray-200">
            {files.slice(-5).reverse().map(file => (
              <div key={file.id} className="p-5 hover:bg-gray-50 flex items-center gap-4">
                <File className="w-6 h-6 text-blue-500" />
                <div className="flex-1">
                  <p className="font-semibold text-gray-900">{file.name}</p>
                  <p className="text-sm text-gray-500">{formatBytes(file.size)}</p>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => handleDownloadFile(file)}
                    className="p-2 text-green-600 hover:bg-green-100 rounded-lg"
                  >
                    <Download className="w-4 h-4" />
                  </button>
                </div>
              </div>
            ))}
            {files.length === 0 && (
              <div className="p-12 text-center text-gray-500">
                <File className="w-16 h-16 mx-auto mb-4 opacity-30" />
                <p>No files uploaded yet</p>
              </div>
            )}
          </div>
        </div>
      </div>
    );
  };

  const FilesView = () => {
    return (
      <div className="space-y-8">
        <div className="bg-white rounded-2xl shadow-lg p-6">
          <div className="flex justify-between items-center mb-6">
            <h3 className="text-xl font-bold">File Management</h3>
            <label className="flex items-center gap-2 px-6 py-3 bg-gradient-to-r from-blue-500 to-purple-500 hover:from-blue-600 hover:to-purple-600 text-white rounded-xl cursor-pointer font-semibold shadow-lg">
              <Upload className="w-5 h-5" />
              Upload
              <input type="file" onChange={handleFileUpload} className="hidden" />
            </label>
          </div>

          {uploadProgress && (
            <div className="border-2 border-blue-500 bg-blue-50 rounded-xl p-5 mb-6">
              <div className="flex items-center gap-3 mb-3">
                <Upload className="w-6 h-6 text-blue-500 animate-bounce" />
                <span className="font-bold text-blue-900">{uploadProgress.fileName}</span>
              </div>
              <div className="w-full bg-blue-200 rounded-full h-3">
                <div className="bg-blue-600 h-3 rounded-full transition-all" style={{ width: `${uploadProgress.progress}%` }}></div>
              </div>
            </div>
          )}

          <div className="divide-y">
            {files.map(file => (
              <div key={file.id} className="py-4 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <File className="w-5 h-5 text-blue-500" />
                  <div>
                    <p className="font-semibold">{file.name}</p>
                    <p className="text-sm text-gray-500">{formatBytes(file.size)}</p>
                  </div>
                </div>
                <div className="flex gap-2">
                  <button
                    onClick={() => handleDownloadFile(file)}
                    className="px-4 py-2 bg-green-100 hover:bg-green-200 text-green-600 rounded-lg"
                  >
                    <Download className="w-4 h-4 inline mr-2" />
                    Download
                  </button>
                  <button
                    onClick={() => handleDeleteFile(file.id)}
                    className="px-4 py-2 bg-red-100 hover:bg-red-200 text-red-600 rounded-lg"
                  >
                    <Trash2 className="w-4 h-4 inline mr-2" />
                    Delete
                  </button>
                </div>
              </div>
            ))}
            {files.length === 0 && (
              <div className="py-12 text-center text-gray-500">
                <File className="w-16 h-16 mx-auto mb-4 opacity-30" />
                <p>No files yet</p>
              </div>
            )}
          </div>
        </div>
      </div>
    );

  return (
    <div className="min-h-screen bg-gray-50">
      <header className="bg-white border-b shadow-sm sticky top-0 z-40">
        <div className="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
          <div className="flex items-center gap-3">
            <div className="w-12 h-12 bg-gradient-to-br from-blue-500 to-purple-500 rounded-xl flex items-center justify-center shadow-lg">
              <Cloud className="w-6 h-6 text-white" />
            </div>
            <div>
              <h1 className="text-xl font-bold">CloudSync Pro</h1>
              <p className="text-xs text-gray-500">
                {currentUser?.username} {userRole === 'vip' && '⭐ VIP'}
              </p>
            </div>
          </div>
          <button
            onClick={() => {
              if (confirm('Logout?')) {
                setIsAuthenticated(false);
                setCurrentView('login');
              }
            }}
            className="flex items-center gap-2 px-4 py-2 bg-red-500 hover:bg-red-600 text-white rounded-xl"
          >
            <LogOut className="w-4 h-4" />
            Logout
          </button>
        </div>
      </header>

      <div className="max-w-7xl mx-auto px-4 py-8">
        <NavigationTabs />
        {currentView === 'dashboard' && <DashboardView />}
        {currentView === 'files' && <FilesView />}
      </div>
    </div>
  );
};

ReactDOM.render(<CloudStoragePlatform />, document.getElementById('root'));
    </script>
